<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Капсула в поездку переехала</title>
    <meta http-equiv="refresh" content="0; url=https://iheartbeard.github.io/wardrobe-trip/" />
    <link rel="canonical" href="https://iheartbeard.github.io/wardrobe-trip/" />
  </head>
  <body>
    <p>Капсула в поездку переехала: <a href="https://iheartbeard.github.io/wardrobe-trip/">https://iheartbeard.github.io/wardrobe-trip/</a></p>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((list) =>
          list.filter((r) => r.scope.endsWith('/trip/')).forEach((r) => r.unregister()),
        );
      }
      location.replace('https://iheartbeard.github.io/wardrobe-trip/');
    </script>
  </body>
</html>
